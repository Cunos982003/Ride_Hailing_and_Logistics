spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/location}
    username: ${DB_USERNAME:location_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      connect-timeout: 2s
      timeout: 2s
platform:
  redis:
    key-prefix: "location-service:"
