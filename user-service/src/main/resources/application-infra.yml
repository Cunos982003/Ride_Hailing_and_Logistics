spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/user}
    username: ${DB_USERNAME:user_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true
