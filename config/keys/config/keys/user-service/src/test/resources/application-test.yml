spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

app:
  jwt:
    key-id: test-key-1
    issuer: https://test.ridehailing.local
    audience: ride-hailing-test
    private-key-path: config/keys/jwt-private.pem
    public-key-path: config/keys/jwt-public.pem
    access-token-lifetime: PT15M
    refresh-token-lifetime: P7D
