name: Foundation verification
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-reports
          path: '**/target/surefire-reports/'
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: docker info && docker compose --profile apps config --quiet
      - run: chmod +x mvnw && ./mvnw -B verify -Pintegration
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-test-reports
          path: '**/target/failsafe-reports/'
