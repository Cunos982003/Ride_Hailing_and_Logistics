spring:
  application:
    name: core-test
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/user
    username: user_app
    password: user-local-only
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false
    clean-on-validation-error: true
  sql:
    init:
      mode: never

jwt:
  secret: test-secret-key-at-least-32-chars-long-for-hs256-algorithm

internal:
  key: test-internal-key
