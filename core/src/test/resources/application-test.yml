spring:
  application:
    name: core-test
  threads:
    virtual:
      enabled: true
  # Datasource is injected dynamically by Testcontainers via @DynamicPropertySource
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false
    clean-on-validation-error: true
  sql:
    init:
      mode: never
  # Disable Redis for integration tests (no Redis container needed for auth tests)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  data:
    redis:
      repositories:
        enabled: false

jwt:
  secret: test-secret-key-at-least-32-chars-long-for-hs256-algorithm

internal:
  key: test-internal-key
