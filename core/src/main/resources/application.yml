spring:
  application:
    name: core
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ride
    username: ride
    password: ${PG_PASSWORD:postgres-local-only}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8000
  shutdown: graceful

jwt:
  secret: ${JWT_SECRET:dev-secret-key-at-least-32-chars-long-for-hs256}

internal:
  key: ${INTERNAL_KEY:dev-internal-key}
