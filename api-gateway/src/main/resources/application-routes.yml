spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: users
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/users/**
            - id: locations
              uri: ${LOCATION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/locations/**
            - id: trips
              uri: ${DISPATCH_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/trips/**
            - id: pricing
              uri: ${PRICING_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/pricing/**
            - id: payments
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/payments/**
            - id: ws-status
              uri: ${WS_GATEWAY_URL:http://localhost:8001}
              predicates:
                - Path=/api/v1/ws-gateway/**
